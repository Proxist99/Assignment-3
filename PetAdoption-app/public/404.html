<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Adoption</title>
    
    <!-- Single Page App Redirect Script for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This script takes the current URL path and redirects it to index.html with the query string
      var pathSegmentsToKeep = 1; // Keeps your repository name (/Assignment-3/)

      var l = window.location;
      var repoName = l.pathname.split('/')[1]; // Extracts 'Assignment-3'
      
      window.location.replace(
        l.protocol + '//' + l.host + '/' + (repoName ? repoName + '/' : '') +
        '?p=/' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&q=' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
